    <main>
        <img src="images/kontakt.jpg" alt="bokstäver som säger contact">
        <h2>Vill du komma i kontakt med mig?</h2>
        <form>
            <label for="name">Namn</label>
            <input type="text" id="name" name="name">
            <br>
            <label for="email">E-post</label>
            <input type="email" placeholder="namn@exempel.se" required id="email" name="email">
            <br>
            <textarea name="message" id="messages" cols="30" rows="5" placeholder="Skriv ditt meddelande här..."></textarea>
            <p>Registrera dig för aviseringar via e-post</p>
            <label>
                <input type="radio" name="notification" value="Ja" required>Ja
            </label>
            <label><input type="radio" name="notification" value="Nej" required>Nej</label>
            <br>
            <button type="submit">Skicka</button>
        </form>
        <p>Du kan även kontakta mig direkt på <a
                href="mailto:eva.m.e.bergstrom@gmail.com">eva.m.e.bergstrom@gmail.com</a></p>
    </main>

    <!--Här har jag lagt länken till kontaktsidan i mitt namn-->
